name: Build Arya

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach build output to a GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The `secrets` context is not available in step-level `if`, so expose "is a signing key configured?" as a flag.
      HAS_SIGNING_KEY: ${{ secrets.ARYA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK. Accept its licenses non-interactively and make sure the
      # exact packages AGP 8.13 needs for compileSdk 36 are installed, so Gradle never has to prompt.
      - name: Prepare Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # `yes` gets SIGPIPE once sdkmanager stops reading, so this pipeline's exit status is ignored on purpose.
          # If a license is still missing, the install below fails loudly.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed | head -n 30

      # No Gradle wrapper is committed, so CI installs Gradle directly. Android Studio users: run
      # `gradle wrapper --gradle-version 8.14.3` once, or let Studio create the wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Arya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Lint (informational)
        run: gradle :app:lintDebug --no-daemon
        continue-on-error: true

      # ---- signed release build for Google Play (only when signing secrets exist) -----------------
      - name: Decode upload keystore
        id: keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arya-upload.jks"
          echo "path=$RUNNER_TEMP/arya-upload.jks" >> "$GITHUB_OUTPUT"

      - name: Release bundle (AAB) and APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ARYA_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ARYA_KEYSTORE_PASSWORD: ${{ secrets.ARYA_KEYSTORE_PASSWORD }}
          ARYA_KEY_ALIAS: ${{ secrets.ARYA_KEY_ALIAS }}
          ARYA_KEY_PASSWORD: ${{ secrets.ARYA_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Arya-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      # If anything above failed, keep the Gradle/Kotlin/lint reports so the real error is easy to read.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
