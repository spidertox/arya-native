name: Build Arya

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach build output to a GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The `secrets` context is not available in step-level `if`, so expose "is a signing key configured?" as a flag.
      HAS_SIGNING_KEY: ${{ secrets.ARYA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK. Accept its licenses non-interactively and make sure the
      # exact packages AGP 8.13 needs for compileSdk 36 are installed, so Gradle never has to prompt.
      - name: Prepare Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # `yes` gets SIGPIPE once sdkmanager stops reading, so this pipeline's exit status is ignored on purpose.
          # If a license is still missing, the install below fails loudly.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed | head -n 30

      # No Gradle wrapper is committed, so CI installs Gradle directly. Android Studio users: run
      # `gradle wrapper --gradle-version 8.14.3` once, or let Studio create the wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Without a real signing key, debug builds are signed with a debug key. A fresh runner would invent a new one
      # every run, and Android refuses to update an app whose signature changed. Caching the key keeps it stable.
      - name: Keep a stable debug signing key
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arya-debug-keystore-v1

      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Lint (informational)
        run: gradle :app:lintDebug --no-daemon
        continue-on-error: true

      # ---- signed release build (only when the signing secrets exist; see docs/SIGNING.md) ---------
      - name: Decode upload keystore
        id: keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ARYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arya-upload.jks"
          echo "path=$RUNNER_TEMP/arya-upload.jks" >> "$GITHUB_OUTPUT"

      - name: Release bundle (AAB) and APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ARYA_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ARYA_KEYSTORE_PASSWORD: ${{ secrets.ARYA_KEYSTORE_PASSWORD }}
          ARYA_KEY_ALIAS: ${{ secrets.ARYA_KEY_ALIAS }}
          ARYA_KEY_PASSWORD: ${{ secrets.ARYA_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      # ---- collect the files that end up in the GitHub Release -----------------------------------
      - name: Name the build files
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="$GITHUB_REF_NAME" ;;
            *)            LABEL="nightly" ;;
          esac
          mkdir -p dist
          if [ "${HAS_SIGNING_KEY}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Arya-${LABEL}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/Arya-${LABEL}.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Arya-${LABEL}-debug.apk"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Arya-build
          path: dist/*
          if-no-files-found: error

      # ---- publish to Releases -------------------------------------------------------------------
      # Every push to main refreshes one rolling pre-release called "nightly"; no tagging needed.
      - name: Move the nightly tag to this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin refs/tags/nightly

      - name: Publish the nightly release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Arya nightly (build ${{ github.run_number }})
          prerelease: true
          make_latest: "false"
          files: dist/*
          body: |
            Automatic build of commit `${{ github.sha }}` from `main`.

            **Install:** download the `.apk` below, open it on your phone and allow "install unknown apps" when asked.
            Builds from the same signing key update each other in place; if Android says the app conflicts with an
            existing one, uninstall the old Arya first.

            Early software: please report problems in Issues.

      # Pushing a tag such as v0.2.0 publishes a normal, numbered release with generated notes.
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Arya ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: dist/*

      # If anything above failed, keep the Gradle/Kotlin/lint reports so the real error is easy to read.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
